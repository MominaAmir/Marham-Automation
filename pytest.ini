[pytest]
testpaths = tests
pythonpath = .


markers =
    offline: checks that need no phone (test_cases.csv vs code)
    preflight: phone, app and login checks; everything else is skipped if this fails
    oc: online consultation flow
    oc_payment: real OC booking paid with Marham Wallet (only if ALLOW_OC_PAYMENT = True)
    pc: physical (in-clinic) consultation flow
    search: search checks
    negative: negative / recovery checks
    late_oc: doctor did not join a video booking - asks: Cancel & Refund / Wait More / Reschedule check
    family: Friends & Family - adds and deletes test members named 'Autotest ...'; nothing is booked
    doctor_app: every DOCTOR app test (pytest -m doctor_app -s runs them all)
    doctor_preflight: doctor app installed, version, test doctor logged in; other doctor tests skipped if it fails
    doctor_login: logout + login with the phone number and OTP you type (only when chosen: -m doctor_login -s)
    doctor_appointments: doctor app Appointments tab and details - read-only
    doctor_accept: Flow 3 - accept a pending appointment (changes data)
    doctor_profile: Flow 4 - profile, locations, schedule and the slots patients see (read-only)
    doctor_schedule: Flow 4 - doctor changes slot length / working day, patient app must follow (restored after)
    doctor_leave: add a leave, check the patient app hides that day, delete the leave
    doctor_chat_media: chat picture and voice note - each must reach the other
    doctor_messages: doctor and patient chat - each message must reach the other app